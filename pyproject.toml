[tool.uv]
package = false
# packages 폴더 아래에 있는 애들을 내 식구로 인정한다.
workspace = { members = ["packages/*"] }

[tool.uv.sources]
vertex-forager = { workspace = true }
vertex-qt = { workspace = true }
vertex-workspace = { workspace = true }

[tool.ruff]
# 전체 프로젝트에 적용될 린터 설정
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Tier‑1 (blocking): core correctness/safety + promoted categories
# Tier‑2 runs in CI (non-blocking) for TCH/SIM/TC.
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF", "G", "C901", "PLR0912", "PLR0915", "C4", "PT"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["vertex_forager", "vertex_qt", "vertex_workspace"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# Tests: keep S101 and TC002/TC003/TC006 for pytest asserts and type-checking imports
"packages/vertex-forager/tests/**" = ["S101", "TC002", "TC003", "TC006"]
# Pydantic v2 resolves field annotations at runtime via get_type_hints();
# all imports used in model fields must stay at module scope.

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: integration tests",
    "manual: opt-in manual verification tests",
    "smoke: fast smoke tests for imports/entrypoints",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = "packages/vertex-forager/tests"

[[tool.mypy.overrides]]
module = ["nest_asyncio.*", "IPython.*", "ipywidgets.*", "yfinance.*", "vertex_forager.cli"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vertex_forager.*"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
disallow_any_generics = false
disallow_any_unimported = false
disallow_any_explicit = false
disallow_any_decorated = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "mkdocs-monorepo-plugin>=1.1.0",
    "ruff==0.15.8",
    "mypy>=1.11.1",
    "pandas-stubs>=2.3.3.260113",
    "types-tqdm>=4.67.3.20260205",
    "types-psutil>=7.2.2.20260130",
    "detect-secrets>=1.5.0",
]

[tool.coverage.run]
relative_files = true

[tool.hypothesis]
max_examples = 50
deadline = 200
