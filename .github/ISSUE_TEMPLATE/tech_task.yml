name: "Maintenance / CI / Chore"
description: "Maintenance, CI, refactor, tests and other non-feature work"
labels: ["type:chore"]
assignees: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      placeholder: What and why
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / Out of Scope
      placeholder: Clearly list included and excluded items
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Tests added or updated
        - label: Docs updated (if applicable)
        - label: CI gates pass locally
        - label: Rollback plan documented in Risk & Rollback
  - type: textarea
    id: validation
    attributes:
      label: Validation
      placeholder: Tests/benchmarks/CI gates, acceptance checks
  - type: textarea
    id: risk
    attributes:
      label: Risk & Rollback
      placeholder: Identify risks and how to revert safely
