---
name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
permissions:
  contents: read
  security-events: write
  actions: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 pinned
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a899987af240c0578ed84ce13c02319a693e168f
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a899987af240c0578ed84ce13c02319a693e168f
        with:
          upload: ${{ github.event_name != 'pull_request' || vars.ENABLE_CODEQL_ON_PR == 'true' || contains(github.event.pull_request.labels.*.name, 'security-critical') }}
