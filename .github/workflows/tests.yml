name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_manual:
        description: "Run manual tests (opt-in)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/vertex-forager
          pip install pytest pytest-asyncio pytest-cov ruff mypy hypothesis
      - name: Lint
        run: |
          ruff check packages/ --fix
      - name: Type check
        run: |
          mypy packages/vertex-forager/src --strict
      - name: Tests (exclude manual)
        if: ${{ inputs.include_manual != 'true' }}
        run: |
          pytest packages/ --cov --cov-fail-under=80 -m "not manual" -q
      - name: Tests (manual only)
        if: ${{ inputs.include_manual == 'true' }}
        run: |
          pytest packages/ --cov --cov-fail-under=80 -m manual -q
