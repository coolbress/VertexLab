---
name: PR Automation
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
concurrency:
  group: pr-automation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
  pull-requests: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const author = (pr.user && pr.user.login) || "";
            if (author.endsWith("[bot]")) {
              core.info("Bot PR detected, skipping title validation.");
              return;
            }
            const title = (pr.title || "").trim();
            const re = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?(!)?: .+$/;
            if (!re.test(title)) {
              core.setFailed(
                "Invalid PR title. Expected: type(scope)?: description with type in [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]."
              );
            }
      - name: Sync type labels from title
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const title = (pr.title || "").trim();
            const body = String(pr.body || "");
            const m = title.match(/^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?(!)?: /);
            if (!m) return;
            const t = m[1];
            const bang = Boolean(m[3]);
            const map = {
              feat: "type:feature",
              fix: "type:fix",
              docs: "type:docs",
              perf: "type:perf",
              refactor: "type:refactor",
              chore: "type:chore",
              ci: "type:chore",
              build: "type:chore",
              test: "type:chore",
              style: "type:chore",
              revert: "type:chore",
            };
            const chosen = map[t];
            const breaking = (t === "feat" && bang) || /BREAKING CHANGE/i.test(body);
            const managed = ["type:feature","type:fix","type:docs","type:perf","type:refactor","type:chore","type:breaking"];
            const labelsResp = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number, per_page: 100 });
            const current = labelsResp.data.map(x => x.name || "");
            for (const label of current) {
              if (managed.includes(label) && label !== chosen && !(breaking && label === "type:breaking")) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }).catch(() => {});
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [chosen] }).catch(() => {});
            if (breaking) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["type:breaking"] }).catch(() => {});
            } else {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "type:breaking" }).catch(() => {});
            }
      - name: Sync package labels from changed files
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const labels = new Set();
            for (const f of files) {
              const p = f.filename || "";
              if (p.startsWith("packages/vertex-forager/")) labels.add("package:vertex-forager");
              if (p.startsWith("packages/vertex-qt/")) labels.add("package:vertex-qt");
              if (p.startsWith("packages/vertex-workspace/")) labels.add("package:vertex-workspace");
              if (
                p === "pyproject.toml" ||
                p.startsWith(".github/") ||
                p.startsWith("src/vertex_lab/") ||
                p.startsWith("scripts/")
              ) {
                labels.add("package:vertex-lab");
              }
            }
            const managed = [
              "package:vertex-forager",
              "package:vertex-qt",
              "package:vertex-workspace",
              "package:vertex-lab",
            ];
            const labelsResp = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number, per_page: 100 });
            const current = labelsResp.data.map(x => x.name || "");
            for (const label of current) {
              if (managed.includes(label) && !labels.has(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label }).catch(() => {});
              }
            }
            if (labels.size > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: Array.from(labels) }).catch(() => {});
            }
