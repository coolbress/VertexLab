---
name: docs-deploy

on:
  push:
    branches: ["main"]
    paths:
      - "mkdocs.yml"
      - "packages/vertex-lab/**"
      - "packages/vertex-forager/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned
      - name: Link Checker (Markdown)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0 pinned
        with:
          args: --verbose --no-progress --max-concurrency 8 --exclude '^\s*$' --exclude '^(yfinance://|mailto:)' --exclude '^https://raw\.githubusercontent\.com/coolbress/VertexLab/python-coverage-comment-action-data/badge\.svg$' --exclude '^https://github\.com/coolbress/VertexLab/tree/python-coverage-comment-action-data$' 'packages/vertex-lab/docs/**/*.md' 'packages/vertex-forager/docs/**/*.md' 'README.md' 'packages/vertex-lab/README.md' 'CONTRIBUTING.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5 pinned
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 pinned
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0 pinned
      - name: Set up Python virtual environment
        run: uv venv
      - name: Install docs deps
        run: |
          uv pip install -q 'mkdocs>=1.6.0' 'mkdocs-material>=9.5.0' 'mkdocstrings[python]>=0.25.0' 'pymdown-extensions>=10.8' 'mkdocs-monorepo-plugin>=0.6.0'
      - name: Install vertex-forager (for mkdocstrings import)
        run: uv pip install -e packages/vertex-forager
      - name: Build site
        run: NO_MKDOCS_2_WARNING=1 uv run mkdocs build --strict --site-dir ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0 pinned
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5 pinned
