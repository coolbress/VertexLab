---
name: Vertex CI
#
# Policy: Actions are SHA-pinned; the inline comment reflects the upstream major version.
# This workflow enforces bounded runtime via timeout-minutes to avoid long hangs.

# 언제 로봇이 깨어날까요?
on:
  push:
    branches: [main]  # main 브랜치에 코드가 올라올 때
  pull_request:
    branches: [main]  # 누군가(혹은 내가) merge 요청을 보낼 때
  workflow_dispatch:
    inputs:
      include_manual:
        description: "Run manual tests (opt-in)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: 🛡️ Code Quality Check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest  # 최신 리눅스 환경에서 실행
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VF_STRUCTURED_LOGS: "1"
      VF_LOG_VERBOSE: "0"
      VF_METRICS_ENABLED: "0"
      VENV: ${{ github.workspace }}/verify-wheel
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 pinned
      - name: Cache uv download/build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 pinned
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', 'packages/**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 pinned

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 pinned
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync  # 라이브러리 설치 테스트
      - name: Compute cache window
        if: ${{ matrix.python-version == '3.10' }}
        id: cache_window
        run: echo "week=$(date +'%G-%V')" >> "$GITHUB_OUTPUT"
      - name: Cache Trivy DB
        if: ${{ matrix.python-version == '3.10' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 pinned
        with:
          path: |
            ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ steps.cache_window.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-${{ steps.cache_window.outputs.week }}
            ${{ runner.os }}-trivy-db
      - name: Trivy FS Scan (SARIF)
        if: ${{ matrix.python-version == '3.10' }}
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 pinned
        with:
          scan-type: fs
          trivyignores: .trivyignore
          scanners: secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: ".hypothesis,.ruff_cache,data,output,.venv,.tox,.cache,build,dist,node_modules"
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
          TRIVY_CACHE_DIR: ~/.cache/trivy
      - name: Upload Trivy SARIF to Security tab
        if: ${{ matrix.python-version == '3.10' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6 pinned
        with:
          sarif_file: trivy-results.sarif
      - name: Enforce Trivy Gate (HIGH/CRITICAL)
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "::error::trivy-results.sarif not found"
            exit 1
          fi
          if command -v jq >/dev/null 2>&1; then
            ERRORS=$(jq '[.runs[].results[] | select(.level=="error")] | length' trivy-results.sarif)
          else
            ERRORS=$(
              (
                grep -oP '"level"\s*:\s*"error"' trivy-results.sarif || true
              ) | wc -l | tr -d ' '
            )
          fi
          echo "Trivy HIGH/CRITICAL findings: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
      - name: Remediation Hints (On Failure)
        if: ${{ failure() }}
        run: |
          echo "::group::Remediation Guidance"
          echo "Common fixes:"
          echo " - Secrets/config: move to env/CI secrets, rotate, remove from history"
          echo " - Dependencies: upgrade vulnerable packages"
          echo "::endgroup::"

      - name: Check Import Cycles
        if: ${{ matrix.python-version == '3.10' }}
        run: python3 scripts/check_cycles.py

      - name: Lint Code (Ruff)
        if: ${{ matrix.python-version == '3.10' }}
        run: uv run ruff check packages/

      - name: Type Check (Mypy)
        if: ${{ matrix.python-version == '3.10' }}
        run: uv run mypy packages/vertex-forager/src --strict

      - name: Lint (Ruff Tier-2 Warnings)
        if: ${{ matrix.python-version == '3.10' }}
        continue-on-error: true
        run: uv run ruff check packages/ --select SIM,TC

      - name: YAML Lint
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          uv run yamllint -c .yamllint .github/workflows/ \
            && uv run yamllint -c .yamllint packages/vertex-forager/mkdocs.yml

      - name: Run Tests (exclude manual) with Coverage Gate
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          uv run pytest packages/ \
            --tb=short \
            --cov=packages/vertex-forager/src/vertex_forager/core \
            --cov=packages/vertex-forager/src/vertex_forager/clients \
            --cov=packages/vertex-forager/src/vertex_forager/writers \
            --cov=packages/vertex-forager/src/vertex_forager/routers \
            --cov-report=term \
            --cov-fail-under=80 \
            -m "not manual"
      - name: Upload coverage data
        if: ${{ matrix.python-version == '3.10' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 pinned
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
      - name: Run Tests (manual only)
        if: ${{ matrix.python-version == '3.10' && github.event_name == 'workflow_dispatch' && github.event.inputs.include_manual == 'true' }}
        run: |
          uv run pytest packages/ -m manual -q
      - name: Run Tests (exclude manual) - other versions
        if: ${{ matrix.python-version != '3.10' }}
        run: uv run pytest packages/vertex-forager/tests -m "not manual" -q
      - name: Build sdist and wheel (vertex-forager)
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          pushd packages/vertex-forager
          OUT="$GITHUB_WORKSPACE/dist/vertex-forager"
          mkdir -p "$OUT"
          uv build --out-dir "$OUT"
          ls -l "$OUT"
          popd
      - name: Smoke install built wheel
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          pushd packages/vertex-forager
          OUT="$GITHUB_WORKSPACE/dist/vertex-forager"
          WHEEL="$(find "$OUT" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if [ -z "$WHEEL" ]; then
            echo "No wheel found in $OUT"
            exit 1
          fi
          python -m venv "$VENV"
          "$VENV/bin/pip" install --upgrade pip
          "$VENV/bin/pip" install "$WHEEL"
          "$VENV/bin/python" - <<'PY'
          import importlib
          import sys
          m = importlib.import_module("vertex_forager")
          print("import ok:", m.__name__)
          PY
          popd
      - name: pip-audit (fails on any vulnerability)
        if: ${{ matrix.python-version == '3.10' }}
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0 pinned
        with:
          virtual-environment: ${{ env.VENV }}
          # Temporary: transitive vulnerability via yfinance optional dependency; local-access regex DoS, not exploitable in CI runtime.
          # Tracking: remove this allowlist once upstream ships a fixed pygments release (CVE-2026-4539).
          ignore-vulns: |
            CVE-2026-4539

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [quality-check]
    if: ${{ needs.quality-check.result == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 pinned
        with:
          persist-credentials: true
      - name: Download coverage data artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 pinned
        with:
          name: coverage-data
          path: .
      - name: Publish PR coverage comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: py-cov-action/python-coverage-comment-action@7188638f871f721a365d644f505d1ff3df20d683  # v3.40 pinned
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update coverage badge data
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@7188638f871f721a365d644f505d1ff3df20d683  # v3.40 pinned
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Aggregator job with a stable check name to satisfy branch protection rules.
  # This job succeeds only if all matrix jobs in "quality-check" succeed.
  quality-gate:
    name: Code Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [quality-check]
    if: ${{ always() }}
    steps:
      - name: Aggregate matrix result
        run: |
          echo "Needs quality-check result: ${{ needs.quality-check.result }}"
          if [ "${{ needs.quality-check.result }}" != "success" ]; then
            echo "One or more matrix legs failed."
            exit 1
          fi

  # Dedicated, non-blocking benchmark job (pushes to main only)
  benchmark-pr:
    name: Benchmark PR (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [quality-check]
    timeout-minutes: 15
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 pinned
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 pinned
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 pinned
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e "packages/vertex-forager[yfinance]"
      - name: Benchmark sanity check
        env:
          VF_ENABLE_PIPELINE_PERF_TEST: "1"
          VF_PERF_BUDGET_PIPELINE_S: "10.0"
          VF_PROFILE_OUTPUT_DIR: ${{ github.workspace }}/output/forager-profiles
        run: uv run python packages/vertex-forager/tests/verification/verify_pipeline_perf.py
      - name: Upload benchmark metrics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 pinned
        with:
          name: benchmark-pr-profile-metrics
          path: ${{ github.workspace }}/output/forager-profiles/profile_metrics.json
          if-no-files-found: ignore

  # Dedicated, non-blocking benchmark job (pushes to main only)
  benchmark-non-blocking:
    name: Benchmark (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [quality-check]
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 pinned
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 pinned
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 pinned
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e "packages/vertex-forager[yfinance]"
      - name: Download previous benchmark baseline artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          BASELINE_ARTIFACT_NAME: benchmark-profile-metrics
          VF_PROFILE_OUTPUT_DIR: ${{ github.workspace }}/output/forager-profiles
        run: uv run python .github/scripts/fetch_previous_benchmark_artifact.py
      - name: Benchmark (non-blocking)
        env:
          VF_ENABLE_PIPELINE_PERF_TEST: "1"
          VF_PROFILE_OUTPUT_DIR: ${{ github.workspace }}/output/forager-profiles
        run: uv run python packages/vertex-forager/tests/verification/verify_pipeline_perf.py
      - name: Detect benchmark metrics artifact
        id: benchmark-metrics
        shell: bash
        run: |
          path="${{ github.workspace }}/output/forager-profiles/profile_metrics.json"
          if [ -f "$path" ]; then
            echo "has_metrics=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_metrics=false" >> "$GITHUB_OUTPUT"
            echo "Benchmark metrics missing; skipping compare/upload."
          fi
      - name: Compare benchmark against baseline
        if: ${{ steps.benchmark-metrics.outputs.has_metrics == 'true' }}
        env:
          VF_PROFILE_OUTPUT_DIR: ${{ github.workspace }}/output/forager-profiles
          BENCHMARK_METRIC_PATH: duration_s
          BENCHMARK_MAX_REGRESSION: "0.30"
        run: uv run python .github/scripts/compare_benchmark_metrics.py
      - name: Upload benchmark metrics artifact
        if: ${{ always() && steps.benchmark-metrics.outputs.has_metrics == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 pinned
        with:
          name: benchmark-profile-metrics
          path: ${{ github.workspace }}/output/forager-profiles/profile_metrics.json
          if-no-files-found: error
