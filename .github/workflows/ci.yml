---
name: Vertex CI
#
# Policy: Actions are SHA-pinned; the inline comment reflects the upstream major version.
# This workflow enforces bounded runtime via timeout-minutes to avoid long hangs.

# 언제 로봇이 깨어날까요?
on:
  push:
    branches: [main]  # main 브랜치에 코드가 올라올 때
  pull_request:
    branches: [main]  # 누군가(혹은 내가) merge 요청을 보낼 때
  workflow_dispatch:
    inputs:
      include_manual:
        description: "Run manual tests (opt-in)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: 🛡️ Code Quality Check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest  # 최신 리눅스 환경에서 실행
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VF_STRUCTURED_LOGS: "1"
      VF_LOG_VERBOSE: "0"
      VF_METRICS_ENABLED: "0"
      VENV: ${{ github.workspace }}/verify-wheel
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 pinned
      - name: Cache uv download/build artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.3 pinned
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', 'packages/**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v5 pinned

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5 pinned
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync  # 라이브러리 설치 테스트
      - name: Compute cache window
        if: ${{ matrix.python-version == '3.10' }}
        id: cache_window
        run: echo "week=$(date +'%G-%V')" >> "$GITHUB_OUTPUT"
      - name: Cache Trivy DB
        if: ${{ matrix.python-version == '3.10' }}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7  # v5.0.3 pinned
        with:
          path: |
            ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db-${{ steps.cache_window.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-trivy-db-${{ steps.cache_window.outputs.week }}
            ${{ runner.os }}-trivy-db
      - name: Trivy FS Scan (SARIF)
        if: ${{ matrix.python-version == '3.10' }}
        id: trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.16.1 pinned
        with:
          scan-type: fs
          trivyignores: .trivyignore
          scanners: secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: ".hypothesis,.ruff_cache,data,output,packages/vertex-forager/legacy_code,.venv,.tox,.cache,build,dist,node_modules"
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
          TRIVY_CACHE_DIR: ~/.cache/trivy
      - name: Upload Trivy SARIF to Security tab
        if: ${{ matrix.python-version == '3.10' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc  # v4 pinned
        with:
          sarif_file: trivy-results.sarif
      - name: Enforce Trivy Gate (HIGH/CRITICAL)
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo "::error::trivy-results.sarif not found"
            exit 1
          fi
          if command -v jq >/dev/null 2>&1; then
            ERRORS=$(jq '[.runs[].results[] | select(.level=="error")] | length' trivy-results.sarif)
          else
            ERRORS=$(
              (
                grep -oP '"level"\s*:\s*"error"' trivy-results.sarif || true
              ) | wc -l | tr -d ' '
            )
          fi
          echo "Trivy HIGH/CRITICAL findings: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
      - name: Remediation Hints (On Failure)
        if: ${{ failure() }}
        run: |
          echo "::group::Remediation Guidance"
          echo "See docs/ci-security.md for triage, severity thresholds, and SLA."
          echo "Common fixes:"
          echo " - Secrets/config: move to env/CI secrets, rotate, remove from history"
          echo " - Dependencies: upgrade vulnerable packages"
          echo "::endgroup::"

      - name: Check Import Cycles
        if: ${{ matrix.python-version == '3.10' }}
        run: python3 scripts/check_cycles.py

      - name: Lint Code (Ruff)
        # packages 폴더 안에 있는 모든 코드를 검사 (legacy_code 제외)
        if: ${{ matrix.python-version == '3.10' }}
        run: uv run ruff check packages/ --exclude "legacy_code"

      - name: Lint (Ruff Tier-2 Warnings)
        if: ${{ matrix.python-version == '3.10' }}
        continue-on-error: true
        run: |
          uv run ruff check packages/ \
            --exclude "legacy_code" \
            --select C4,PT,TCH,SIM,TC

      - name: YAML Lint
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          uv run yamllint -c .yamllint .github/workflows/ \
            && uv run yamllint -c .yamllint packages/vertex-forager/mkdocs.yml

      - name: Run Tests (exclude manual) with Coverage Gate
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          uv run pytest packages/ \
            --tb=short \
            --cov=packages/vertex-forager/src/vertex_forager/core \
            --cov=packages/vertex-forager/src/vertex_forager/clients \
            --cov=packages/vertex-forager/src/vertex_forager/writers \
            --cov=packages/vertex-forager/src/vertex_forager/routers \
            --cov-report=term \
            --cov-fail-under=80 \
            -m "not manual"
      - name: Run Tests (manual only)
        if: ${{ matrix.python-version == '3.10' && github.event_name == 'workflow_dispatch' && github.event.inputs.include_manual == 'true' }}
        run: |
          uv run pytest packages/ -m manual -q
      - name: Run Tests (exclude manual) - other versions
        if: ${{ matrix.python-version != '3.10' }}
        run: uv run pytest packages/vertex-forager/tests -m "not manual" -q
      - name: Build sdist and wheel (vertex-forager)
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          pushd packages/vertex-forager
          OUT="$GITHUB_WORKSPACE/dist/vertex-forager"
          mkdir -p "$OUT"
          uv build --out-dir "$OUT"
          ls -l "$OUT"
          popd
      - name: Smoke install built wheel
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          pushd packages/vertex-forager
          OUT="$GITHUB_WORKSPACE/dist/vertex-forager"
          WHEEL="$(find "$OUT" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if [ -z "$WHEEL" ]; then
            echo "No wheel found in $OUT"
            exit 1
          fi
          python -m venv "$VENV"
          "$VENV/bin/pip" install --upgrade pip
          "$VENV/bin/pip" install "$WHEEL"
          "$VENV/bin/python" - <<'PY'
          import importlib
          import sys
          m = importlib.import_module("vertex_forager")
          print("import ok:", m.__name__)
          PY
          popd
      - name: pip-audit (fails on any vulnerability)
        if: ${{ matrix.python-version == '3.10' }}
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0 pinned
        with:
          virtual-environment: ${{ env.VENV }}

  # Aggregator job with a stable check name to satisfy branch protection rules.
  # This job succeeds only if all matrix jobs in "quality-check" succeed.
  quality-gate:
    name: Code Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [quality-check]
    if: ${{ always() }}
    steps:
      - name: Aggregate matrix result
        run: |
          echo "Needs quality-check result: ${{ needs.quality-check.result }}"
          if [ "${{ needs.quality-check.result }}" != "success" ]; then
            echo "One or more matrix legs failed."
            exit 1
          fi

  # Dedicated, non-blocking benchmark job (pushes to main only)
  benchmark-non-blocking:
    name: Benchmark (non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [quality-check]
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 pinned
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v5 pinned
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5 pinned
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e "packages/vertex-forager[yfinance]"
      - name: Download previous benchmark baseline artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          BASELINE_ARTIFACT_NAME: benchmark-profile-metrics
          VF_PROFILE_OUTPUT_DIR: ${{ github.workspace }}/output/forager-profiles
        run: uv run python .github/scripts/fetch_previous_benchmark_artifact.py
      - name: Benchmark (non-blocking)
        env:
          VF_PROFILE_OUTPUT_DIR: ${{ github.workspace }}/output/forager-profiles
        run: uv run python packages/vertex-forager/tests/verification/verify_pipeline_perf.py
      - name: Compare benchmark against baseline
        env:
          VF_PROFILE_OUTPUT_DIR: ${{ github.workspace }}/output/forager-profiles
          BENCHMARK_METRIC_PATH: duration_s
          BENCHMARK_MAX_REGRESSION: "0.20"
        run: uv run python .github/scripts/compare_benchmark_metrics.py
      - name: Upload benchmark metrics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808  # v4 pinned
        with:
          name: benchmark-profile-metrics
          path: ${{ github.workspace }}/output/forager-profiles/profile_metrics.json
          if-no-files-found: error
