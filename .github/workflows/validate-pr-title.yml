---
name: validate-pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title against Conventional Commits (warning-only)
        id: validate
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$PR_TITLE"
          echo "PR title: \"$PR_TITLE\""
          re='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?(!)?: .+ \(#([0-9]+)\)$'
          if echo "$title" | grep -Eq "$re"; then
            echo "Title OK"
            exit 0
          else
            echo "::warning::PR title does not follow Conventional Commits or missing issue number (#123)."
            exit 1
          fi
        continue-on-error: true
