---
name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      vertex_release_created: ${{ steps.release.outputs['packages/vertex-forager--release_created'] }}
      vertex_tag_name: ${{ steps.release.outputs['packages/vertex-forager--tag_name'] }}
      vertex_qt_release_created: ${{ steps.release.outputs['packages/vertex-qt--release_created'] }}
      vertex_qt_tag_name: ${{ steps.release.outputs['packages/vertex-qt--tag_name'] }}
      vertex_workspace_release_created: ${{ steps.release.outputs['packages/vertex-workspace--release_created'] }}
      vertex_workspace_tag_name: ${{ steps.release.outputs['packages/vertex-workspace--tag_name'] }}
      vertex_lab_release_created: ${{ steps.release.outputs['.--release_created'] }}
      vertex_lab_tag_name: ${{ steps.release.outputs['.--tag_name'] }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: googleapis/release-please-action@8bb7a2ed0f90c9802c83129a9488d235a1f31a7c
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish-packages:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: vertex-forager
            package_dir: packages/vertex-forager
            release_key: vertex_release_created
            tag_key: vertex_tag_name
          - component: vertex-qt
            package_dir: packages/vertex-qt
            release_key: vertex_qt_release_created
            tag_key: vertex_qt_tag_name
          - component: vertex-workspace
            package_dir: packages/vertex-workspace
            release_key: vertex_workspace_release_created
            tag_key: vertex_workspace_tag_name
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Clean dist
        if: ${{ needs.release.outputs[matrix.release_key] == 'true' }}
        run: rm -rf "dist/${{ matrix.component }}/"

      - name: Build wheel/sdist (${{ matrix.component }})
        if: ${{ needs.release.outputs[matrix.release_key] == 'true' }}
        run: |
          OUT="${GITHUB_WORKSPACE}/dist/${{ matrix.component }}"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          uv build "${{ matrix.package_dir }}" --out-dir "$OUT"
          ls -l "$OUT"

      - name: Upload assets to GitHub Release
        if: ${{ needs.release.outputs[matrix.release_key] == 'true' }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          files: dist/${{ matrix.component }}/*
          tag_name: ${{ needs.release.outputs[matrix.tag_key] }}
          fail_on_unmatched_files: true

  publish-vertex-lab:
    needs: [release, publish-packages]
    if: ${{ needs.release.outputs.vertex_lab_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Build wheel/sdist (vertex-lab)
        run: |
          OUT="${GITHUB_WORKSPACE}/dist/vertex-lab"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          uv build . --out-dir "$OUT"
          ls -l "$OUT"
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          files: dist/vertex-lab/*
          tag_name: ${{ needs.release.outputs.vertex_lab_tag_name }}
          fail_on_unmatched_files: true
