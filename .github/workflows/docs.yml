---
name: docs-ci

on:
  pull_request:
    paths:
      - "mkdocs.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "packages/**/mkdocs.yml"
      - "packages/vertex-lab/**"
      - "packages/vertex-forager/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-deploy.yml"

permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 pinned
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 pinned
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 pinned
      - name: Set up Python virtual environment
        run: uv venv
      - name: Install docs deps
        run: |
          uv pip install -q 'mkdocs>=1.6.0' 'mkdocs-material>=9.5.0' 'mkdocstrings[python]>=0.25.0' 'pymdown-extensions>=10.8' 'mkdocs-monorepo-plugin>=0.6.0'
      - name: Install vertex-forager (for mkdocstrings import)
        run: uv pip install -e packages/vertex-forager
      - name: Build docs (strict)
        run: NO_MKDOCS_2_WARNING=1 uv run mkdocs build --strict
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 pinned
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0 pinned
        with:
          args: --verbose --no-progress --max-concurrency 8 --max-redirects 10 --exclude '^\s*$' --exclude '^(yfinance://|mailto:)' --exclude '\.ipynb$' --exclude '^https://raw\.githubusercontent\.com/coolbress/VertexLab/python-coverage-comment-action-data/badge\.svg$' --exclude '^https://github\.com/coolbress/VertexLab/tree/python-coverage-comment-action-data$' 'packages/vertex-lab/docs/**/*.md' 'packages/vertex-forager/docs/**/*.md' 'README.md' 'packages/vertex-lab/README.md' 'CONTRIBUTING.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
