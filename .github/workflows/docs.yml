---
name: docs-ci

on:
  pull_request:
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "packages/**/mkdocs.yml"
      - "packages/vertex-lab/**"
      - "packages/vertex-forager/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 pinned
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0 pinned
      - name: Set up Python virtual environment
        run: uv venv
      - name: Install docs deps
        run: |
          uv pip install -q 'mkdocs>=1.6.0' 'mkdocs-material>=9.5.0' 'mkdocstrings[python]>=0.25.0' 'pymdown-extensions>=10.8' 'mkdocs-monorepo-plugin>=0.6.0'
      - name: Install vertex-forager (for mkdocstrings import)
        run: uv pip install -e packages/vertex-forager
      - name: Build docs (strict)
        run: NO_MKDOCS_2_WARNING=1 uv run mkdocs build --strict
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned
      - name: Link Checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0 pinned
        with:
          args: --verbose --no-progress --max-concurrency 8 --max-redirects 10 --exclude '^\s*$' --exclude '^(yfinance://|mailto:)' --exclude '\.ipynb$' --exclude '^https://raw\.githubusercontent\.com/coolbress/VertexLab/python-coverage-comment-action-data/badge\.svg$' --exclude '^https://github\.com/coolbress/VertexLab/tree/python-coverage-comment-action-data$' 'docs/**/*.md' 'packages/vertex-lab/docs/**/*.md' 'packages/vertex-forager/docs/**/*.md' 'README.md' 'packages/vertex-lab/README.md' 'CONTRIBUTING.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
